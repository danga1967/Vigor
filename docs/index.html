<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ece5d8">
<title>My Apps</title>
<style>
  :root { --bg:#ece5d8; --card:#fbf8f1; --ink:#23262a; --soft:#5d5b53; --line:#d8cfbe; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1d1f; --card:#26292c; --ink:#ece9e2; --soft:#a29f95; --line:#3a3e42; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); line-height: 1.45; padding: 24px 20px 40px; }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 12px 0 4px; }
  p.sub { color: var(--soft); margin-bottom: 22px; }
  a.app { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
          padding: 16px 18px; margin-bottom: 12px; color: inherit; text-decoration: none; }
  a.app:active { transform: scale(.98); }
  a.app b { display: block; font-size: 1.1rem; }
  a.app span { color: var(--soft); font-size: .92rem; }
  p.note { color: var(--soft); font-size: .85rem; margin-top: 22px; }
</style>
</head>
<body>
<main>
  <h1>My Apps</h1>
  <p class="sub">Open one, then use Chrome's menu → <b>Install app</b>. Each installs on its own.</p>
  <a class="app" href="vigor/"><b>Vigor</b><span>Daily strength &amp; mobility workouts</span></a>
  <a class="app" href="japanese/"><b>日本語道</b><span>The Path of Japanese</span></a>
  <a class="app" href="stride/"><b>Stride</b><span>Half marathon training</span></a>
  <p class="note">This page itself is not an app, so it isn't installable.</p>
</main>
</body>
</html>
